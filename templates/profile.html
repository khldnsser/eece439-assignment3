{% extends 'base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>Profile</h2>
<p>Username: {{ user.username }}</p>
<p>Joined: {{ user.date_joined|date:'F j, Y' }}</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save profile</button>
</form>
{% endblock %}
